# Attach this file to a dedicated Railway Cron service.
# The web service must remain long-lived and must not carry cronSchedule.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/frontend-angular/**/*", "src/c2/server/**", "src/c2/database/**", "src/c2/shared/**", "src/c2/modules/adapter_runtime/**/*", "config/**", "Dockerfile", "package.json", "pnpm-lock.yaml", "railway.cron.toml"]

[deploy]
startCommand = "node dist/scheduled.js"
cronSchedule = "*/15 * * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

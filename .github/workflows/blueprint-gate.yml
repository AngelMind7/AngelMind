name: blueprint-gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:api-v1-contract
      - run: pnpm check:master-contract
      - run: node scripts/check-v4-route-contract.mjs
      - run: node scripts/check-application-menu.mjs
      - run: pnpm check:tool-runtime-contract
      - run: pnpm exec vitest run server/tool-execution-pipeline.test.ts server/tool-runtime.test.ts server/simulation-engine.test.ts server/simulation-rest.test.ts
      - run: pnpm check:provider-neutral
      - run: pnpm check:uuid-buffer-usage
      - run: pnpm check:migration-journal
      - run: pnpm check:migration-safety
      - run: pnpm check:migration-rollback

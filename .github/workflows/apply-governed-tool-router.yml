name: Apply governed tool router integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'AngelMind7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Integrate server-side execution authorization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/routers.ts')
          s = p.read_text()
          old_import = 'import * as toolRuntime from "./tool-runtime";\n'
          new_import = old_import + 'import { authorizeToolExecution } from "./tool-execution-policy";\n'
          if 'import { authorizeToolExecution } from "./tool-execution-policy";' not in s:
              if old_import not in s:
                  raise SystemExit('tool-runtime import anchor not found')
              s = s.replace(old_import, new_import, 1)
          start = s.index('  tools: router({')
          end = s.index('  control: router({', start)
          new = '''  tools: router({
    catalog: protectedProcedure
      .input(
        z
          .object({
            category: z.string().trim().min(1).max(120).optional(),
            disposition: z
              .enum([
                "candidate_offline_or_artifact",
                "candidate_passive_review",
                "disabled_high_risk",
                "disabled_review_required",
              ])
              .optional(),
            riskClass: z
              .enum(["low", "medium", "high", "critical", "unknown"])
              .optional(),
          })
          .optional()
      )
      .query(({ input }) => toolCatalog.listToolCatalog(input)),
    search: protectedProcedure
      .input(z.object({ query: z.string().trim().min(1).max(120) }))
      .query(({ input }) => toolCatalog.searchToolCatalog(input.query)),
    summary: protectedProcedure.query(() =>
      toolCatalog.getToolCatalogSummary()
    ),
    runtimeAdapters: protectedProcedure.query(() =>
      toolRuntime.listRegisteredAdapters()
    ),
    runtimeHealth: protectedProcedure.query(() =>
      toolRuntime.checkRegisteredAdapterHealth()
    ),
    run: protectedProcedure
      .input(
        z.object({
          workspaceId: z.number().int().positive(),
          target: z.string().trim().min(1).max(255).optional(),
          toolKey: z.string().trim().min(1).max(160),
          mode: z.enum([
            "offline_artifact",
            "passive_readonly",
            "active_nondestructive",
            "privileged_or_destructive",
          ]),
          approvalId: z.number().int().positive().optional(),
          input: z.string().max(2_000_000),
          timeoutMs: z.number().int().min(1_000).max(120_000).optional(),
          maxOutputBytes: z.number().int().min(1_024).max(2_000_000).optional(),
        })
      )
      .mutation(async ({ ctx, input }) => {
        const authorization = await authorizeToolExecution({
          userId: ctx.user.id,
          workspaceId: input.workspaceId,
          toolKey: input.toolKey,
          mode: input.mode,
          target: input.target,
          input: input.input,
          approvalId: input.approvalId,
        });
        if (!authorization.allowed) {
          return {
            requestId: "",
            toolKey: input.toolKey,
            status: "blocked" as const,
            exitCode: null,
            stdout: "",
            stderr: "",
            durationMs: 0,
            reason: authorization.reason,
          };
        }
        return toolRuntime.runRegisteredTool({
          ...input,
          scopeValidated: true,
          humanApproval: authorization.humanApproval,
        });
      }),
  }),
'''
          if s.count('  tools: router({') != 1 or s.count('  control: router({') < 1:
              raise SystemExit('router anchors not found')
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Commit router integration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts
          git rm .github/workflows/apply-governed-tool-router.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'router already integrated; removing temporary workflow only'
            git commit -m 'chore: remove governed router integration workflow'
          else
            git commit -m 'feat: enforce governed tool execution at router boundary'
          fi
          git push

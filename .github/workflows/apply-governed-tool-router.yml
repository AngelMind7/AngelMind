name: Apply governed tool router integration

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Integrate governed capability execution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/routers.ts')
          s = p.read_text()
          governed_import = 'import { executeGovernedCapability } from "./governed-execution-service";\n'
          anchor = 'import * as toolRuntime from "./tool-runtime";\n'
          if governed_import not in s:
              if anchor not in s:
                  raise SystemExit('tool-runtime import anchor not found')
              s = s.replace(anchor, anchor + governed_import, 1)
          start = s.find('  tools: router({')
          end = s.find('  governance: router({')
          new = '''  tools: router({
    catalog: protectedProcedure
      .input(z.object({
        category: z.string().trim().min(1).max(120).optional(),
        disposition: z.enum(["candidate_offline_or_artifact", "candidate_passive_review", "disabled_high_risk", "disabled_review_required"]).optional(),
        riskClass: z.enum(["low", "medium", "high", "critical", "unknown"]).optional(),
      }).optional())
      .query(({ input }) => toolCatalog.listToolCatalog(input)),
    search: protectedProcedure
      .input(z.object({ query: z.string().trim().min(1).max(120) }))
      .query(({ input }) => toolCatalog.searchToolCatalog(input.query)),
    summary: protectedProcedure.query(() => toolCatalog.getToolCatalogSummary()),
    runtimeAdapters: protectedProcedure.query(() => toolRuntime.listRegisteredAdapters()),
    runtimeHealth: protectedProcedure.query(() => toolRuntime.checkRegisteredAdapterHealth()),
    run: protectedProcedure
      .input(z.object({
        workspaceId: z.number().int().positive(),
        capability: z.string().trim().min(1).max(160),
        target: z.string().trim().min(1).max(255).optional(),
        mode: z.enum(["offline_artifact", "passive_readonly", "active_nondestructive", "privileged_or_destructive"]),
        approvalId: z.number().int().positive().optional(),
        input: z.string().max(2_000_000),
        sessionId: z.number().int().positive().optional(),
        assetId: z.number().int().positive().optional(),
      }))
      .mutation(({ ctx, input }) => executeGovernedCapability({
        userId: ctx.user.id,
        workspaceId: input.workspaceId,
        capability: input.capability,
        target: input.target,
        mode: input.mode,
        approvalId: input.approvalId,
        input: input.input,
        sessionId: input.sessionId,
        assetId: input.assetId,
      })),
  }),
'''
          if end < 0:
              raise SystemExit('governance router boundary not found')
          if start < 0:
              s = s[:end] + new + s[end:]
          else:
              s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Commit router integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: expose governed capability execution router'
          git push

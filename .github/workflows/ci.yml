name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify provider-neutral source
        run: node scripts/check-provider-neutral.mjs
      - name: Migration journal consistency
        run: node scripts/check-migration-journal.mjs
      - name: Migration safety
        run: pnpm check:migration-safety
      - name: Migration rollback contract
        run: pnpm check:migration-rollback
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test -- --run
      - name: Test coverage
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
      - name: Production build
        run: pnpm build
      - name: Enforce bundle budget
        run: pnpm check:budget
      - name: Validate PWA manifest
        run: python3 -m json.tool client/public/manifest.json >/dev/null
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test research foundation
        working-directory: research-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest
          ruff check .

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: angelmind_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/angelmind_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to ephemeral database
        run: pnpm drizzle-kit migrate
      - name: Run database integration contracts
        run: pnpm exec vitest run server/ai-memory-retention.integration.test.ts server/ai-memory-context.integration.test.ts server/global-search.integration.test.ts

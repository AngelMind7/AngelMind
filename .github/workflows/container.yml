name: Container build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime --tag angelmind:${{ github.sha }} .
      - name: Inspect image metadata
        run: docker image inspect angelmind:${{ github.sha }} --format '{{.Config.User}} {{.Config.ExposedPorts}}'
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: angelmind:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json
          artifact-name: angelmind-sbom-${{ github.sha }}
          upload-artifact: true
      - name: Scan runtime image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: angelmind:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
      - name: Upload vulnerability scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: angelmind-trivy-${{ github.sha }}
          path: trivy-results.sarif
          if-no-files-found: error
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Tag runtime image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag angelmind:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Push runtime image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0
      - name: Sign runtime image keylessly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Verify runtime image signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          cosign verify
          --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/container.yml@refs/heads/main$'
          --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          ghcr.io/${{ github.repository }}:${{ github.sha }} | tee cosign-verification.json
      - name: Upload signing verification evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: angelmind-cosign-${{ github.sha }}
          path: cosign-verification.json
          if-no-files-found: error

  tools-smoke:
    name: Build and execute tools adapter smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build tools image
        run: docker build --file Dockerfile.tools --tag angelmind-tools:${{ github.sha }} .
      - name: Execute every provisioned adapter
        run: docker run --rm angelmind-tools:${{ github.sha }}

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/frontend-angular/**/*", "src/c2/server/**", "src/c2/database/**", "src/c2/shared/**", "src/c2/modules/adapter_runtime/**/*", "config/**", "Dockerfile", "package.json", "pnpm-lock.yaml", "railway.toml"]

[deploy]
startCommand = "node dist/_core/index.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

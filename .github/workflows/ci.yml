name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify provider-neutral source
        run: node scripts/check-provider-neutral.mjs
      - name: Migration journal consistency
        run: node scripts/check-migration-journal.mjs
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test -- --run
      - name: Production build
        run: pnpm build
      - name: Validate PWA manifest
        run: python3 -m json.tool client/public/manifest.json >/dev/null
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test research foundation
        working-directory: research-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest
          ruff check .

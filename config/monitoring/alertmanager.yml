global:
  resolve_timeout: 5m

route:
  receiver: angelmind-ops
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity = "critical"
      receiver: angelmind-critical
      repeat_interval: 30m

receivers:
  - name: angelmind-ops
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL}
        send_resolved: true
  - name: angelmind-critical
    webhook_configs:
      - url: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL}
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity =~ "warning|info"
    equal: [service]

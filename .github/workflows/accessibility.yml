name: Staging accessibility audit
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Explicit HTTPS staging URL"
        required: true
        type: string
permissions:
  contents: read
jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate staging target
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          case "$BASE_URL" in
            https://*) ;;
            *) echo "Accessibility target must use HTTPS" >&2; exit 1 ;;
          esac
          case "$BASE_URL" in
            *localhost*|*127.0.0.1*|*production*|*prod.*)
              echo "Refusing local or production-looking target" >&2
              exit 1
              ;;
          esac
      - name: Run axe accessibility suite
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          ANGELMIND_E2E_TOKEN: ${{ secrets.ANGELMIND_E2E_TOKEN }}
        run: pnpm test:e2e -- e2e/accessibility.spec.ts e2e/authenticated-accessibility.contract.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore

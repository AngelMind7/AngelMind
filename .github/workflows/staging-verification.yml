name: Staging verification

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to the dedicated staging database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_ENV: development
  ALLOW_STAGING_TESTS: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check staging configuration
        id: staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Staging database is not configured yet; provider verification remains a launch gate."
            exit 0
          fi
          case "$DATABASE_URL" in
            *mysql.railway.internal*|*production*)
              echo "Refusing internal or production-looking database URL" >&2
              exit 1
              ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Apply migrations when explicitly requested
        if: ${{ inputs.apply_migrations && steps.staging.outputs.configured == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm drizzle-kit migrate
      - name: Run staging database contracts
        if: ${{ steps.staging.outputs.configured == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm exec vitest run server/ai-memory-retention.integration.test.ts server/ai-memory-context.integration.test.ts server/global-search.integration.test.ts
      - name: Install Chromium
        if: ${{ steps.staging.outputs.configured == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Run authenticated lifecycle E2E when configured
        if: ${{ steps.staging.outputs.configured == 'true' && secrets.ANGELMIND_E2E_TOKEN != '' && secrets.STAGING_BASE_URL != '' }}
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          ANGELMIND_E2E_TOKEN: ${{ secrets.ANGELMIND_E2E_TOKEN }}
        run: pnpm exec playwright test e2e/authenticated-lifecycle.contract.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore

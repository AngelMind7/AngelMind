version: 1
platform: railway
policy:
  default_enabled: false
  execution_requires_verified_tool: true
  require_scope_validation: true
  high_risk_requires_human_approval: true
  critical_risk_requires_human_approval: true
  prohibited_in_default_pack:
    - credential_theft
    - phishing
    - persistence
    - command_and_control
    - destructive_execution

packs:
  - id: artifact-pack
    railway_service: angelmind-runtime-artifact
    purpose: Offline inspection of user-supplied artifacts only
    allowed_dispositions:
      - candidate_offline_or_artifact
    network: disabled
    categories:
      - Binary/Artifact Analysis
      - Source Code
      - Dependencies
      - Secrets Detection
      - Data
      - Reporting
    install_strategy: apt_or_pinned_python_package

  - id: analysis-pack
    railway_service: angelmind-runtime-analysis
    purpose: Offline and local analysis of normalized inputs
    allowed_dispositions:
      - candidate_offline_or_artifact
    network: disabled
    categories:
      - AI/LLM Security
      - Validation
      - Configuration
      - Supply Chain
      - Containers
      - Infrastructure
    install_strategy: pinned_package_manifest

  - id: passive-pack
    railway_service: angelmind-runtime-passive
    purpose: Scope-bound passive observation and public-data collection
    allowed_dispositions:
      - candidate_passive_review
    network: restricted_by_policy
    categories:
      - Asset Intelligence
      - Threat Intelligence
      - Traffic Analysis
      - Log Analysis
      - Email/DNS Security
    install_strategy: pinned_package_manifest

  - id: review-required-pack
    railway_service: angelmind-runtime-review
    purpose: Quarantined metadata only; no execution in default deployment
    allowed_dispositions:
      - disabled_review_required
      - disabled_high_risk
    network: disabled
    categories:
      - Social Engineering
      - Adversary Simulation
      - Post-Exploitation
      - Blockchain Security
      - Physical/Hardware Security
      - Web
      - Wireless
    install_strategy: none

railway:
  web_service: angelmind-web
  worker_service: angelmind-worker
  health_path: /healthz
  required_runtime_env:
    - NODE_ENV
    - DATABASE_URL
    - APP_ENCRYPTION_KEY
  optional_runtime_env:
    - RUNTIME_PACK_ID
    - RUNTIME_MAX_SECONDS
    - RUNTIME_MAX_OUTPUT_BYTES
    - RUNTIME_NETWORK_POLICY

# The master capability set is explicit and auditable. Entries marked
# external_artifact are never replaced by a fake executable: the image build
# must receive the vendor artifact and checksum through build arguments.
master_tools:
  - id: burp
    command: burp-rest-cli
    provisioning: external_artifact
    risk_class: high
  - id: jwt_tool
    command: jwt_tool.py
    provisioning: pinned_source
    risk_class: high
  - id: dalfox
    command: dalfox
    provisioning: pinned_binary
    risk_class: high
  - id: ssrfmap
    command: ssrfmap
    provisioning: pinned_source
    risk_class: high
  - id: interactsh
    command: interactsh-client
    provisioning: pinned_binary
    risk_class: medium
  - id: ffuf
    command: ffuf
    provisioning: pinned_binary
    risk_class: medium
  - id: cloudfox
    command: cloudfox
    provisioning: pinned_binary
    risk_class: medium
  - id: graphql_cop
    command: graphql-cop
    provisioning: pinned_source
    risk_class: medium
  - id: sqlmap
    command: sqlmap
    provisioning: pinned_source
    risk_class: critical
  - id: nuclei
    command: nuclei
    provisioning: pinned_binary
    risk_class: medium
  - id: subfinder
    command: subfinder
    provisioning: pinned_binary
    risk_class: low
  - id: httpx
    command: httpx
    provisioning: pinned_binary
    risk_class: low
  - id: gitleaks
    command: gitleaks
    provisioning: pinned_binary
    risk_class: low
  - id: trivy
    command: trivy
    provisioning: pinned_binary
    risk_class: low
  - id: naabu
    command: naabu
    provisioning: pinned_binary
    risk_class: low
  - id: katana
    command: katana
    provisioning: pinned_binary
    risk_class: low
  - id: custom_scripts
    command: python3
    provisioning: repository_runtime
    risk_class: high

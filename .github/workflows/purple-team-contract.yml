name: purple-team-domain-contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  purpleteam-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-purple-team-contract.mjs
      - run: pnpm exec vitest run server/purple-team.test.ts
